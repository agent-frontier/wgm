name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill, docs & installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: Bash syntax check
        run: |
          for s in scripts/*.sh; do bash -n "$s"; done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills.git@5d4c1fda3f786fff826c7f56b6cb3341e7f3a911#subdirectory=skills-ref"

      - name: Validate skill
        # skills-ref needs the skill dir basename to equal the skill name ("wgm"),
        # so validate from the parent of the checked-out repo directory.
        run: |
          cd ..
          skills-ref validate wgm

      - name: Validate companion skills
        # Same basename rule: companions/teach-me holds the "teach-me" skill, so validate from
        # inside companions/. These install as sibling skills, so they get the same gate as wgm.
        run: |
          cd companions
          skills-ref validate teach-me
          skills-ref validate quiz-me
          skills-ref validate rugged

      - name: Docs backpressure check
        run: bash scripts/check-docs.sh

      - name: Evals fixture schema check
        run: bash scripts/check-evals.sh

      - name: Harness contract check
        run: bash scripts/check-harnesses.sh

      - name: Role-adapter derivation check
        run: bash scripts/sync-agent-adapters.sh --check

      - name: Install harness (bash)
        run: bash scripts/test-install.sh

      - name: Agent-adapter harness (bash)
        run: bash scripts/test-agent-adapters.sh

      - name: Plugin-registry harness (bash)
        run: bash scripts/test-plugin-registry.sh

      - name: Stage 10 memory harness (bash)
        run: bash scripts/test-stage10-memory.sh

      - name: Stage 10 bounded runner harness (bash)
        run: bash scripts/test-stage10-runner.sh

      - name: Stage 10 qualification harness (bash)
        run: bash scripts/test-stage10-qualification.sh

      - name: Stage 10 router harness (bash)
        run: bash scripts/test-stage10-router.sh

      - name: Stage 10 experiments harness (bash)
        run: bash scripts/test-stage10-experiments.sh

      - name: Stage 10 policy harness (bash)
        run: bash scripts/test-stage10-policy.sh

      - name: Stage 10 end-to-end harness (bash)
        run: bash scripts/test-stage10-e2e.sh

      - name: Loop harness (bash)
        run: bash scripts/test-loop.sh

      - name: Swarm harness (bash)
        run: bash scripts/test-swarm.sh

      - name: Harvest-hive harness (bash)
        run: bash scripts/test-harvest-hive.sh

      - name: Grade-evals harness (bash, fake agent)
        run: bash scripts/test-grade-evals.sh

      - name: Check-evals harness (bash)
        run: bash scripts/test-check-evals.sh

      - name: Check-harnesses harness (bash)
        run: bash scripts/test-check-harnesses.sh

      - name: Check-docs harness (bash)
        run: bash scripts/test-check-docs.sh

      - name: Check-trailers harness (bash)
        run: bash scripts/test-check-trailers.sh

      - name: Check-doc-sync harness (bash)
        run: bash scripts/test-check-doc-sync.sh

      - name: Release-index harness (bash)
        # The release-metadata generator/validator only runs for real at tag time, when a mistake is
        # already an immutable reference. Running its offline harness on every PR is what keeps that
        # gate honest. Needs no network, no gh, and no token — contents: read is enough.
        run: bash scripts/test-release-index.sh

      # Portable half of the WSL/Windows boundary check. The REAL boundary cannot run here: a
      # GitHub-hosted Linux runner has no Windows interop and a hosted Windows runner has no WSL
      # distro, so scripts/test-wsl-windows-boundary.sh is a manual / self-hosted-runner command and
      # is never marked verified from this job ([learn] issue agent-frontier/wgm#101).
      - name: WSL boundary harness (bash, no real WSL in hosted CI)
        run: bash scripts/test-wsl-boundary-harness.sh

      - name: Install scripts (PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$null, [ref]$null) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/test-install.ps1), [ref]$null, [ref]$null) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/test-wsl-reachability.ps1), [ref]$null, [ref]$null) | Out-Null
          ./scripts/test-install.ps1
